services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pluginmax
      POSTGRES_USER: pluginmax
      POSTGRES_PASSWORD: pluginmax
    ports:
      - "127.0.0.1:${BATCH11B_POSTGRES_PORT:-54418}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pluginmax -d pluginmax"]
      interval: 1s
      timeout: 3s
      retries: 40
    volumes:
      - pluginmax-batch11b-postgres-data:/var/lib/postgresql/data

volumes:
  pluginmax-batch11b-postgres-data:
    name: pluginmax-batch11b-postgres-data
