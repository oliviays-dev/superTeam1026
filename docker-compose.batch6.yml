services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pluginmax
      POSTGRES_USER: pluginmax
      POSTGRES_PASSWORD: pluginmax
    ports:
      - "127.0.0.1:${BATCH6_POSTGRES_PORT:-54369}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pluginmax -d pluginmax"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pluginmax-batch6-postgres-data:/var/lib/postgresql/data

volumes:
  pluginmax-batch6-postgres-data:
    name: pluginmax-batch6-postgres-data
