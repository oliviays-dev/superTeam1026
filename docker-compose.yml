services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pluginmax
      POSTGRES_USER: pluginmax
      POSTGRES_PASSWORD: pluginmax
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pluginmax -d pluginmax"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pluginmax-postgres-data:/var/lib/postgresql/data

volumes:
  pluginmax-postgres-data:
