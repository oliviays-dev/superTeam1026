name: CI

on:
  push:
    branches: [main, "feat/**", "feature/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            vendor/deepseek-harness/pnpm-lock.yaml
      - name: Install Pluginmax workspace
        run: pnpm install --frozen-lockfile
      - name: Static, unit, build, and package checks
        run: pnpm run check
      - name: Build locked upstream DSH
        run: pnpm --dir vendor/deepseek-harness install --frozen-lockfile && pnpm --dir vendor/deepseek-harness build
      - name: Install and smoke canary
        run: |
          set +e
          mkdir -p .tmp
          ./scripts/install-profile.sh > .tmp/install-profile.log 2>&1
          install_status=$?
          smoke_status=0
          if [[ "$install_status" -eq 0 ]]; then
            ./scripts/smoke.sh > .tmp/smoke.log 2>&1
            smoke_status=$?
          fi
          if [[ "$install_status" -ne 0 || "$smoke_status" -ne 0 ]]; then
            {
              echo '## Smoke diagnostics'
              echo '```text'
              tail -n 200 .tmp/install-profile.log 2>/dev/null || true
              tail -n 200 .tmp/smoke.log 2>/dev/null || true
            } | sed -E \
              -e 's#https://[^[:space:]]+token=[^[:space:]]+[)"]?#[redacted launch url]#g' \
              -e 's#[A-Za-z0-9_-]{40,}#[redacted]#g' \
            | tee .tmp/smoke-diagnostics.txt \
              >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done < <(tail -n 9 .tmp/smoke-diagnostics.txt)
            cat .tmp/install-profile.log 2>/dev/null || true
            cat .tmp/smoke.log 2>/dev/null || true
            [[ "$install_status" -ne 0 ]] && exit "$install_status"
            exit "$smoke_status"
          fi
      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics
          path: .tmp/smoke-diagnostics.txt
          if-no-files-found: error

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Pluginmax workspace
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm run build:packages
      - name: PostgreSQL v12 to v13 compatibility smoke
        run: ./scripts/maintenance-effects-postgres-smoke.sh
      - name: Start isolated PostgreSQL
        run: |
          ./scripts/db-compose.sh -p pluginmax-ci -f docker-compose.batch8.yml up -d postgres
          for attempt in {1..60}; do
            if ./scripts/db-compose.sh -p pluginmax-ci -f docker-compose.batch8.yml \
              exec -T postgres pg_isready -U pluginmax -d pluginmax; then
              break
            fi
            sleep 1
          done
      - name: Apply migrations
        env:
          DATABASE_URL: postgres://pluginmax:pluginmax@127.0.0.1:54389/pluginmax
        run: pnpm db:migrate
      - name: Unit and PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://pluginmax:pluginmax@127.0.0.1:54389/pluginmax
        run: pnpm test
      - name: PostgreSQL upgrade smoke
        env:
          DATABASE_URL: postgres://pluginmax:pluginmax@127.0.0.1:54389/pluginmax
        run: ./scripts/runtime-postgres-smoke.sh

  runtime-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Pluginmax workspace
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: API, process recovery, and browser smoke
        run: pnpm test:ci
      - name: Upload runtime logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-browser-logs
          path: .tmp/ci-batch8
          if-no-files-found: warn
