      meeting.time = ($(`#meetingSettingsTime-${settingsContext}`)?.value || "").trim() || meeting.time;
      meeting.summary = ($(`#meetingSettingsSummary-${settingsContext}`)?.value || "").trim() || meeting.summary;
      const wasModal = Boolean(state.modal);
      if (wasModal) closeModal();
      renderApp();
      toast("已保存会议设置");
      break;
    }
    case "meeting-people-add": {
      const meeting = meetingForContext(state.meetingActionContext || "center");
      const ids = $$('input[name="meetingPerson"]:checked').map((input) => input.value);
      if (ids.length === 0) { toast("请选择要添加的参与人", "error"); break; }
      meeting.participants = [...new Set([...meeting.participants, ...ids])];
      closeModal(); renderApp(); toast(`已添加 ${ids.length} 位参与人`);
      break;
    }
    case "meeting-person-remove": {
      const meeting = meetingForContext(el.dataset.context || "center");
      meeting.participants = meeting.participants.filter((id) => id !== el.dataset.id);
      renderApp(); toast("已移除参与人");
      break;
    }

    case "teammate-open": state.view = "teammates"; state.teammateId = el.dataset.id; state.teammateMode = "runtime"; renderApp(); break;
    case "ai-open-teammate": state.view = "teammates"; state.meetingOpen = false; state.teammateId = el.dataset.id; state.teammateMode = "runtime"; renderApp(); break;
    case "tm-mode": state.teammateMode = el.dataset.mode; renderApp(); break;
    case "tm-tab": state.teammateTab = el.dataset.tab; renderApp(); break;
    case "tm-plan": state.teammateTab = "plan"; renderApp(); break;
    case "plan-create": {
      const text = ($("#planDraft")?.value || "").trim();
      if (!text) { toast("请先描述要安排的工作", "error"); break; }
      const id = "TSK-" + (1100 + TASKS.length);
      TASKS.unshift({ id, title: text.slice(0, 60), status: "todo", priority: $("#planPriority").value, projectId: $("#planProject").value, assignee: state.teammateId, due: dateOffset(2), source: "task", desc: text, tags: ["AI 计划"] });
      state.planDraft = "";
      renderApp(); toast("已创建计划项，默认为 P2（演示）");
      break;
    }
    case "tm-audit-more": toast("已加载更多历史执行记录（演示）"); break;
    case "tm-save-definition": toast("已保存 AI 伙伴定义"); break;
    case "profile-templates-open": openModal("profile-templates"); break;
    case "profile-template-use": closeModal(); toast(`已选择模版：${el.dataset.name}（演示）`); break;
    case "report-generate": {
      const teammate = teammateById(state.teammateId);
      const reports = TEAMMATE_REPORTS[teammate.id] || (TEAMMATE_REPORTS[teammate.id] = []);
      const report = {
        date: today,
        at: "刚刚",
        content: `## 今日结论\n\n已完成 ${teammate.name} 的今日工作汇总，当前状态为「${teammate.status}」。\n\n## 关键进展\n\n- 当前工作与工作计划已同步。\n- 关联任务与工作流状态已核对。\n\n## 风险与待确认\n\n- 请重点检查阻塞节点与待决策事项。\n\n## 下一步\n\n按计划推进，并在下一次检查点更新进展。`
      };
      const index = reports.findIndex((item) => item.date === today);
      if (index >= 0) reports[index] = report;
      else reports.unshift(report);
      renderApp();
      toast("已更新今日工作日报");
      break;
    }

    case "create": openModal("create", { entity: el.dataset.entity }); break;
    case "create-confirm": {
      const entity = state.modalData?.entity;
      const name = ($("#createName")?.value || "").trim();
      if (!name) { toast("请填写名称", "error"); break; }
      if (entity === "project") {
        const id = "p-" + Date.now();
        PROJECTS.push({ id, name, code: "PRJ-" + String(PROJECTS.length + 1).padStart(3, "0"), workspaceId: "ws-" + id, path: "/Users/oliviayang/Codex/一切皆插件/" + id, owner: "Olivia", status: "进行中", health: "健康", progress: 0, start: today, target: dateOffset(60), desc: "新建项目，待补充项目说明。", roles: rolesFromLibrary(["r-owner", "r-req", "r-dev", "r-review", "r-qa", "r-research"]), workflowTemplates: ["wt-employee", "wt-gui"], members: [{ userId: "olivia", workspaceRole: "负责人", projectRoles: ["r-owner"], scope: "项目、成员、任务、工作流" }], reports: [] });
        state.projectId = id; state.view = "projects";
      } else if (entity === "meeting") {
        const id = "MTG-" + (130 + MEETINGS.length);
        MEETINGS.push({ id, title: name, projectId: $("#createProject")?.value || "p-plugin", time: "今天 18:00 - 18:30", status: "未开始", participants: ["olivia"], summary: "新建会议，待补充议题。", minutes: "", messages: [] });
        state.meetingSelected = id;
        state.meetingTab = "conversation";
        state.meetingFilter = "all";
        state.meetingSearch = "";
        state.view = "meetings";
      } else {
        TEAMMATES.push({ id: "tm-" + Date.now(), name, profile: "研究分析基础模板", owner: "Olivia", status: "待命", version: "v1.0", desc: "新建 AI 伙伴，待补充职责描述。", soul: "只处理已授权的工作。", tools: ["docs", "task"], scopes: ["工作区：一切皆插件"] });
      }
      closeModal(); renderApp(); toast(`已创建${entity === "project" ? "项目" : entity === "meeting" ? "会议" : " AI 伙伴"}`);
      break;
    }
    case "confirm-ok": {
      const data = state.modalData || {};
      if (data.action === "member-remove-confirm") {
        const p = projectById(state.projectId);
        p.members = p.members.filter((m) => m.userId !== data.userId);
        closeModal(); renderApp(); toast("已移除成员");
      } else if (data.action === "project-role-remove-confirm") {
        const p = projectById(state.projectId);
        p.roles = p.roles.filter((role) => role.id !== data.roleId);
        p.members.forEach((member) => {
          member.projectRoles = (member.projectRoles || []).filter((id) => id !== data.roleId);
        });
        closeModal(); renderApp(); openProjectSettings("roles"); toast("已移除项目角色");
      } else if (data.action === "wft-delete-confirm") {
        const index = WF_TEMPLATES.findIndex((template) => template.id === data.templateId);
        if (index >= 0) WF_TEMPLATES.splice(index, 1);
        state.wfTemplateSelected = WF_TEMPLATES[0]?.id || "";
        closeModal(); openModal("wf-template"); toast("已删除工作流模版");
      } else {
        closeModal();
      }
      break;
    }
    default: break;
  }
});

document.addEventListener("input", (event) => {
  const el = event.target;
  if (el.id === "projectSearch") { state.projectSearch = el.value; renderApp("projectSearch"); }
  else if (el.id === "projectReportSearch") { state.projectReportSearch = el.value; renderApp("projectReportSearch"); }
  else if (el.id === "projectArtifactSearch") { state.projectArtifactSearch = el.value; renderApp("projectArtifactSearch"); }
  else if (el.id === "taskSearch") { state.taskSearch = el.value; renderApp("taskSearch"); }
  else if (el.id === "wfSearch") { state.wfSearch = el.value; renderApp("wfSearch"); }
  else if (el.id === "reportSearch") { state.reportSearch = el.value; renderApp("reportSearch"); }
  else if (el.id === "planDraft") { state.planDraft = el.value; }
  else if (el.id === "ptSearch") { state.projectTemplateSearch = el.value; renderApp("ptSearch"); }
  else if (el.id === "tmSearch") { state.teammateSearch = el.value; renderApp("tmSearch"); }
  else if (el.id === "meetingSearch") { state.meetingSearch = el.value; renderApp("meetingSearch"); }
  else if (el.id === "meetingSwitcherSearch") { state.meetingPickerQuery = el.value; renderApp("meetingSwitcherSearch"); }
  else if (el.id.startsWith("meetingComposer")) {
    const composerContext = el.closest(".meeting-composer")?.dataset.composerContext || "rail";
    const mentionMatch = el.value.match(/@([^@\s]*)$/);
    if (composerContext === "rail") {
      state.railMeetingDraft = el.value;
      state.railMeetingMentionOpen = Boolean(mentionMatch);
      state.railMeetingMentionQuery = mentionMatch ? mentionMatch[1] : "";
    } else {
      state.meetingDraft = el.value;
      state.meetingMentionOpen = Boolean(mentionMatch);
      state.meetingMentionQuery = mentionMatch ? mentionMatch[1] : "";
    }
    renderApp(el.id);
  }
  else if (el.dataset.act === "font-size") {
    state.fontSize = Number(el.value);
    applyPreferences();
    const label = el.closest(".settings-row")?.querySelector("small");
    if (label) label.textContent = `当前 ${state.fontSize}px · 影响全平台正文字号`;
  }
});

document.addEventListener("change", (event) => {
  const el = event.target;
  const act = el.dataset.act;
  if (act === "layout-switch") { state.activeLayoutId = el.value; persistLayouts(); renderApp(); }
  else if (act === "wb-width") {
    updateActiveLayout((layout) => { layout.modules[el.dataset.id].cols = Number(el.value); });
    renderApp();
  } else if (act === "task-project") { state.taskProject = el.value; renderApp(); }
  else if (act === "task-priority") { state.taskPriority = el.value; renderApp(); }
  else if (act === "task-source") { state.taskSource = el.value; renderApp(); }
  else if (act === "wf-project") { state.wfProject = el.value; renderApp(); }
  else if (act === "wf-status") { state.wfStatus = el.value; renderApp(); }
  else if (act === "meeting-status-filter") { state.meetingFilter = el.value; renderApp(); }
  else if (act === "project-report-from") { state.projectReportFrom = el.value; renderApp(); }
  else if (act === "project-report-to") { state.projectReportTo = el.value; renderApp(); }
  else if (act === "artifact-stage") { state.projectArtifactStage = el.value; renderApp(); }
  else if (act === "artifact-theme") { state.projectArtifactTheme = el.value; renderApp(); }
  else if (act === "artifact-from") { state.projectArtifactFrom = el.value; renderApp(); }
  else if (act === "artifact-to") { state.projectArtifactTo = el.value; renderApp(); }
  else if (act === "report-from") { state.reportFrom = el.value; renderApp(); }
  else if (act === "report-to") { state.reportTo = el.value; renderApp(); }
  else if (act === "wft-level") { state.wfTemplateLevel = el.value; renderModal(); }
  else if (el.id === "planProject") { state.planProject = el.value; }
  else if (el.id === "planPriority") { state.planPriority = el.value; }
  else if (el.id === "planReview") { state.planAutoReview = el.checked; }
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    if (state.meetingPickerOpen) {
      state.meetingPickerOpen = false;
      state.meetingPickerQuery = "";
      renderApp();
      return;
    }
    if (state.meetingMentionOpen || state.railMeetingMentionOpen) {
      var escapeComposerContext = document.activeElement?.closest(".meeting-composer")?.dataset.composerContext || "rail";
      if (escapeComposerContext === "rail") {
        state.railMeetingMentionOpen = false;
        state.railMeetingMentionQuery = "";
      } else {
        state.meetingMentionOpen = false;
        state.meetingMentionQuery = "";
      }
      renderApp(`meetingComposer-${escapeComposerContext}`);
      return;
    }
    if (state.wfDeliveryNodeId) {
      closeWorkflowDeliveryPopover();
      renderApp();
      return;
    }
    if (state.modal) { closeModal(); return; }
    if (state.taskSelected) { state.taskSelected = ""; renderDrawer(); return; }
  }
  if ((event.key === "Enter" || event.key === " ") && event.target.matches('[role="button"][data-act]')) {
    event.preventDefault();
    event.target.click();
  }
});

document.addEventListener("scroll", () => {
  if (state.wfDeliveryNodeId) closeWorkflowDeliveryPopover();
}, true);
window.addEventListener("resize", () => {
  if (state.wfDeliveryNodeId) closeWorkflowDeliveryPopover();
});

/* drag: workbench reorder */
document.addEventListener("dragstart", (event) => {
  const head = event.target.closest("[data-wb-drag]");
  if (head) {
    state.dragWbId = head.dataset.wbDrag;
    head.closest(".wb-card")?.classList.add("dragging");
    event.dataTransfer.effectAllowed = "move";
    try { event.dataTransfer.setData("text/plain", state.dragWbId); } catch (e) { /* noop */ }
    return;
  }
  const card = event.target.closest("[data-task-card]");
  if (card) {
    event.dataTransfer.effectAllowed = "move";
    try { event.dataTransfer.setData("text/plain", card.dataset.taskCard); } catch (e) { /* noop */ }
  }
});
document.addEventListener("dragover", (event) => {
  const wbCard = event.target.closest("[data-wb-card]");
  if (wbCard && state.dragWbId) { event.preventDefault(); wbCard.classList.add("drop-target"); return; }
  const column = event.target.closest("[data-status]");
  if (column) { event.preventDefault(); column.classList.add("drop"); }
});
document.addEventListener("dragleave", (event) => {
  const wbCard = event.target.closest("[data-wb-card]");
  if (wbCard) wbCard.classList.remove("drop-target");
  const column = event.target.closest("[data-status]");
  if (column) column.classList.remove("drop");
});
document.addEventListener("drop", (event) => {
  const wbCard = event.target.closest("[data-wb-card]");
  if (wbCard && state.dragWbId) {
    event.preventDefault();
    moveModule(state.dragWbId, wbCard.dataset.wbCard);
    state.dragWbId = "";
    renderApp();
    toast("已调整模块顺序");
    return;
  }
  const column = event.target.closest("[data-status]");
  if (column) {
    event.preventDefault();
    let id = "";
    try { id = event.dataTransfer.getData("text/plain"); } catch (e) { /* noop */ }
    const task = taskById(id);
    if (task && task.status !== column.dataset.status) {
      task.status = column.dataset.status;
      renderApp();
      toast(`已移动到「${statusLabel(task.status)}」`);
    }
    column.classList.remove("drop");
  }
});
document.addEventListener("dragend", () => {
  state.dragWbId = "";
  $$(".wb-card.dragging,.wb-card.drop-target").forEach((el) => el.classList.remove("dragging", "drop-target"));
  $$(".column.drop").forEach((el) => el.classList.remove("drop"));
});

/* drag: workbench height */
let resizeState = null;
document.addEventListener("pointerdown", (event) => {
  const handle = event.target.closest("[data-wb-resize]");
  if (!handle) return;
  const card = handle.closest(".wb-card");
  resizeState = { id: handle.dataset.wbResize, startY: event.clientY, startH: card.getBoundingClientRect().height, card };
  card.classList.add("fixed-h");
  event.preventDefault();
});
document.addEventListener("pointermove", (event) => {
  if (!resizeState) return;
  const height = Math.max(190, Math.min(900, resizeState.startH + event.clientY - resizeState.startY));
  resizeState.card.style.height = height + "px";
});
document.addEventListener("pointerup", () => {
  if (!resizeState) return;
  const height = Math.round(resizeState.card.getBoundingClientRect().height);
  updateActiveLayout((layout) => { layout.modules[resizeState.id].height = height; });
  resizeState = null;
});

/* ---------------- init ---------------- */
initLayouts();
applyPreferences();
renderApp();
})();
</script>
</body>
</html>
