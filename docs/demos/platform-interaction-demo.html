<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH Enterprise+ · 平台交互演示</title>
<style>
/* ============================================================
   Design tokens — 与《平台交互与视觉设计规范》一致
   ============================================================ */
:root{
  --dsw-alias-bg-base:#0f1116;
  --dsw-alias-bg-layer-1:#161a21;
  --dsw-alias-bg-layer-2:#1d222b;
  --dsw-alias-bg-layer-3:#262c37;
  --dsw-alias-border-l2:#2a303b;
  --dsw-alias-border-l3:#353c49;
  --dsw-alias-border-l4:#4a5363;
  --dsw-alias-label-primary:#e8ecf3;
  --dsw-alias-label-secondary:#a2abba;
  --dsw-alias-label-tertiary:#707a8a;
  --dsw-alias-label-primary-foreground:#ffffff;
  --dsw-alias-button-primary-fill:#4f8ef7;
  --dsw-alias-accent-primary:#4f8ef7;
  --dsw-alias-state-success-primary:#34d47e;
  --dsw-alias-state-warning-primary:#e2a737;
  --dsw-alias-state-error-primary:#e5534b;
  --dsw-alias-agent-primary:#8b7bf7;
  --dsw-alias-brand-primary:#4f8ef7;

  --fs-page:19px;
  --fs-detail:16px;
  --fs-title:14px;
  --fs-body:13px;
  --fs-secondary:12px;
  --fs-caption:11px;
  --fs-micro:10px;

  --radius-chip:4px;
  --radius-control:6px;
  --radius-card:7px;
  --radius-panel:8px;

  --shadow-1:0 12px 28px rgba(0,0,0,.18);
  --shadow-2:0 14px 34px rgba(0,0,0,.28);
  --shadow-3:0 18px 48px rgba(0,0,0,.35);

  --focus-ring:0 0 0 2px color-mix(in srgb,var(--dsw-alias-accent-primary) 45%,transparent);
}
html[data-theme="light"]{
  --dsw-alias-bg-base:#f5f7fa;
  --dsw-alias-bg-layer-1:#ffffff;
  --dsw-alias-bg-layer-2:#eef1f5;
  --dsw-alias-bg-layer-3:#e5e9f0;
  --dsw-alias-border-l2:#e2e6ed;
  --dsw-alias-border-l3:#d2d8e2;
  --dsw-alias-border-l4:#b7c0cd;
  --dsw-alias-label-primary:#1a1f29;
  --dsw-alias-label-secondary:#596273;
  --dsw-alias-label-tertiary:#8a93a2;
  --dsw-alias-label-primary-foreground:#ffffff;
  --dsw-alias-button-primary-fill:#2f6feb;
  --dsw-alias-accent-primary:#2f6feb;
  --dsw-alias-state-success-primary:#1f8f53;
  --dsw-alias-state-warning-primary:#b7791f;
  --dsw-alias-state-error-primary:#d0453b;
  --dsw-alias-agent-primary:#7a5af8;
  --dsw-alias-brand-primary:#2f6feb;
  --shadow-1:0 12px 28px rgba(20,30,50,.10);
  --shadow-2:0 14px 34px rgba(20,30,50,.16);
  --shadow-3:0 18px 48px rgba(20,30,50,.22);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--dsw-alias-bg-base);
  color:var(--dsw-alias-label-primary);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:var(--fs-body);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--dsw-alias-accent-primary);text-decoration:none}
svg{display:block}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{border-radius:999px;background:var(--dsw-alias-border-l3)}
::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   Shell
   ============================================================ */
#app{
  position:fixed;inset:0;display:grid;
  grid-template-columns:264px minmax(0,1fr);
  transition:grid-template-columns .2s ease;
}
#app.rail-closed{grid-template-columns:72px minmax(0,1fr)}
#app.meeting-open{grid-template-columns:264px minmax(0,1fr) min(410px,34vw)}
#app.rail-closed.meeting-open{grid-template-columns:72px minmax(0,1fr) min(410px,34vw)}

.sidebar{
  display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;
  padding:14px 12px;background:var(--dsw-alias-bg-layer-1);
  border-right:1px solid var(--dsw-alias-border-l3);
}
.brand{display:flex;align-items:center;gap:9px;min-width:0;padding:2px}
.brand-logo{
  width:30px;height:30px;flex:none;display:grid;place-items:center;
  border:1px solid var(--dsw-alias-border-l3);border-radius:var(--radius-panel);
  background:var(--dsw-alias-bg-layer-2);color:var(--dsw-alias-accent-primary);
  font-size:var(--fs-body);font-weight:700;
}
.brand-copy{flex:1;min-width:0}
.brand-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-body);font-weight:650}
.brand-sub{display:block;color:var(--dsw-alias-label-tertiary);font-size:var(--fs-micro);line-height:1.2}
.rail-toggle{
  width:30px;height:30px;flex:none;display:grid;place-items:center;padding:0;
  border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-control);
  background:var(--dsw-alias-bg-layer-2);color:var(--dsw-alias-label-secondary);
}
.rail-toggle:hover{color:var(--dsw-alias-label-primary);border-color:var(--dsw-alias-border-l4)}
.rail-toggle svg{width:15px;height:15px}

.nav{display:grid;gap:2px;margin-top:14px;flex:none}
.nav button{
  width:100%;min-height:36px;display:flex;align-items:center;gap:9px;padding:7px 9px;
  border:0;border-radius:var(--radius-card);background:transparent;
  color:var(--dsw-alias-label-secondary);font-size:var(--fs-secondary);text-align:left;
}
.nav button:hover{color:var(--dsw-alias-label-primary);background:var(--dsw-alias-bg-layer-2)}
.nav button.active{
  color:var(--dsw-alias-label-primary);
  background:color-mix(in srgb,var(--dsw-alias-accent-primary) 14%,transparent);
  box-shadow:inset 2px 0 0 var(--dsw-alias-accent-primary);
}
.nav svg{width:15px;height:15px;flex:none}
.nav-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.workspace-scope{
  flex:1;min-height:0;margin-top:14px;padding-top:14px;overflow-y:auto;
  border-top:1px solid var(--dsw-alias-border-l3);
}
.workspace-title{display:flex;align-items:center;justify-content:space-between;padding:0 2px;margin-bottom:6px;color:var(--dsw-alias-label-tertiary);font-size:var(--fs-caption)}
.ws-group{margin-bottom:4px}
.ws-item{display:flex;align-items:center;gap:7px;width:100%;padding:6px 7px;border:0;border-radius:var(--radius-control);background:transparent;color:var(--dsw-alias-label-secondary);font-size:var(--fs-secondary);text-align:left}
.ws-item:hover{background:var(--dsw-alias-bg-layer-2);color:var(--dsw-alias-label-primary)}
.ws-item.active{background:var(--dsw-alias-bg-layer-2);color:var(--dsw-alias-label-primary);font-weight:600}
.ws-item svg{width:13px;height:13px;flex:none;color:var(--dsw-alias-label-tertiary)}
.ws-children{display:grid;gap:1px;margin:0 0 4px 15px;padding-left:10px;border-left:1px solid var(--dsw-alias-border-l3)}
.ws-child{display:flex;align-items:center;gap:6px;width:100%;padding:5px 7px;border:0;border-radius:5px;background:transparent;color:var(--dsw-alias-label-secondary);font-size:var(--fs-caption);text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ws-child:hover{background:var(--dsw-alias-bg-layer-2);color:var(--dsw-alias-label-primary)}

.sidebar-foot{display:flex;align-items:center;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--dsw-alias-border-l3)}
.account{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:42px;padding:7px;border:0;border-radius:var(--radius-card);background:transparent;text-align:left}
.account:hover{background:var(--dsw-alias-bg-layer-2)}
.avatar{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--dsw-alias-accent-primary);color:#fff;font-size:var(--fs-micro);font-weight:800}
.avatar.agent{background:conic-gradient(from 210deg,#8b6cff,#4f8ef7,#7ed0ff,#ff79c9,#8b6cff)}
.account-copy{min-width:0}
.account-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-secondary);font-weight:650}
.account-role{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dsw-alias-label-tertiary);font-size:var(--fs-micro)}
.settings-btn{width:36px;height:36px;flex:none;display:grid;place-items:center;padding:0;border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-card);background:var(--dsw-alias-bg-layer-2);color:var(--dsw-alias-label-secondary)}
.settings-btn:hover{color:var(--dsw-alias-label-primary)}
.settings-btn.active{color:var(--dsw-alias-accent-primary);border-color:color-mix(in srgb,var(--dsw-alias-accent-primary) 45%,transparent);background:color-mix(in srgb,var(--dsw-alias-accent-primary) 10%,var(--dsw-alias-bg-layer-2))}
.settings-btn svg{width:15px;height:15px}

#app.rail-closed .brand-copy,
#app.rail-closed .nav-label,
#app.rail-closed .workspace-scope,
#app.rail-closed .account-copy{display:none}
#app.rail-closed .sidebar{padding:12px 15px}
#app.rail-closed .nav{justify-items:center}
#app.rail-closed .nav button{width:42px;height:42px;min-height:42px;justify-content:center;padding:0}
#app.rail-closed .brand{display:none}
#app.rail-closed .sidebar-foot{display:grid;justify-items:center;gap:6px;margin-top:auto;padding-top:0;border-top:0}
#app.rail-closed .account{width:42px;flex:none;justify-content:center;padding:0}

.main{min-width:0;min-height:0;overflow:auto;background:var(--dsw-alias-bg-base)}
.page{min-height:100%;padding:18px 20px 28px;display:flex;flex-direction:column}

/* ============================================================
   Page head
   ============================================================ */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.page-head h1{margin:0;font-size:var(--fs-page);line-height:1.3;font-weight:700}
.page-sub{margin-top:4px;color:var(--dsw-alias-label-secondary);font-size:var(--fs-secondary);line-height:1.5}
.head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ============================================================
   Controls
   ============================================================ */
.btn{
  height:32px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:0 12px;border:0;border-radius:var(--radius-control);
  background:var(--dsw-alias-button-primary-fill);color:var(--dsw-alias-label-primary-foreground);
  font-size:var(--fs-secondary);font-weight:600;white-space:nowrap;
}
.btn:hover{filter:brightness(1.06)}
.btn.secondary{background:transparent;border:0.5px solid var(--dsw-alias-border-l3);color:var(--dsw-alias-label-primary);font-weight:500}
.btn.secondary:hover{border-color:var(--dsw-alias-border-l4);background:var(--dsw-alias-bg-layer-2);filter:none}
.btn.danger{background:transparent;border:0.5px solid color-mix(in srgb,var(--dsw-alias-state-error-primary) 45%,transparent);color:var(--dsw-alias-state-error-primary);font-weight:500}
.btn.small{height:28px;padding:0 10px;font-size:var(--fs-secondary)}
.btn.icon{width:28px;height:28px;padding:0;flex:none;border:0.5px solid var(--dsw-alias-border-l3);background:transparent;color:var(--dsw-alias-label-secondary)}
.btn.icon:hover{color:var(--dsw-alias-label-primary);background:var(--dsw-alias-bg-layer-2);filter:none}
.btn.icon svg{width:14px;height:14px}
.btn.icon.meeting-page-action{width:32px;height:32px}
.btn.icon.meeting-page-action.active{color:var(--dsw-alias-accent-primary);border-color:color-mix(in srgb,var(--dsw-alias-accent-primary) 45%,transparent);background:color-mix(in srgb,var(--dsw-alias-accent-primary) 10%,transparent)}
.follow-btn{color:var(--dsw-alias-label-secondary)}
.follow-btn.active{color:var(--dsw-alias-accent-primary);border-color:color-mix(in srgb,var(--dsw-alias-accent-primary) 45%,transparent);background:color-mix(in srgb,var(--dsw-alias-accent-primary) 10%,transparent)}
.follow-btn svg{width:14px;height:14px}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}

.seg{display:inline-flex;align-items:center;gap:3px;padding:3px;border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-panel);background:var(--dsw-alias-bg-layer-1)}
.seg button{height:30px;padding:5px 11px;border:0;border-radius:5px;background:transparent;color:var(--dsw-alias-label-secondary);font-size:var(--fs-secondary);white-space:nowrap}
.seg button:hover{color:var(--dsw-alias-label-primary);background:var(--dsw-alias-bg-layer-2)}
.seg button.active{background:var(--dsw-alias-accent-primary);color:var(--dsw-alias-label-primary-foreground);font-weight:600}

.tabs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding-bottom:6px;border-bottom:0.5px solid var(--dsw-alias-border-l3)}
.tab{height:32px;padding:6px 10px;border:0;border-radius:var(--radius-control);background:transparent;color:var(--dsw-alias-label-secondary);font-size:var(--fs-secondary);white-space:nowrap}
.tab:hover{color:var(--dsw-alias-label-primary)}
.tab.active{background:var(--dsw-alias-bg-layer-3);color:var(--dsw-alias-label-primary);font-weight:600}

.search{display:flex;align-items:center;gap:7px;height:32px;padding:0 9px;border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-control);background:var(--dsw-alias-bg-base);min-width:0}
.search:focus-within{border-color:var(--dsw-alias-accent-primary);box-shadow:var(--focus-ring)}
.search svg{width:13px;height:13px;flex:none;color:var(--dsw-alias-label-secondary)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:var(--fs-secondary)}
.search input::placeholder{color:var(--dsw-alias-label-tertiary)}

.select,.input,.textarea{
  width:100%;height:32px;min-width:0;padding:0 9px;
  border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-control);
  background:var(--dsw-alias-bg-base);color:var(--dsw-alias-label-primary);font-size:var(--fs-secondary);
}
.select:focus,.input:focus,.textarea:focus{outline:none;border-color:var(--dsw-alias-accent-primary);box-shadow:var(--focus-ring)}
.textarea{height:auto;min-height:78px;padding:8px 9px;resize:vertical;line-height:1.6}
.select.compact{width:auto;min-width:120px}

.pill{display:inline-flex;align-items:center;border-radius:999px;padding:1px 7px;font-size:var(--fs-caption);white-space:nowrap;background:var(--dsw-alias-bg-layer-3);color:var(--dsw-alias-label-secondary)}
.pill.progress{color:var(--dsw-alias-accent-primary);background:color-mix(in srgb,var(--dsw-alias-accent-primary) 14%,transparent)}
.pill.notice{color:var(--dsw-alias-state-warning-primary);background:color-mix(in srgb,var(--dsw-alias-state-warning-primary) 14%,transparent)}
.pill.warn{color:var(--dsw-alias-state-error-primary);background:color-mix(in srgb,var(--dsw-alias-state-error-primary) 14%,transparent)}
.pill.done{color:var(--dsw-alias-state-success-primary);background:color-mix(in srgb,var(--dsw-alias-state-success-primary) 14%,transparent)}
.pill.agent{color:var(--dsw-alias-agent-primary);background:color-mix(in srgb,var(--dsw-alias-agent-primary) 14%,transparent)}
.pill.muted{color:var(--dsw-alias-label-tertiary);background:var(--dsw-alias-bg-layer-2)}

.chip{display:inline-flex;align-items:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-chip);padding:1px 6px;background:var(--dsw-alias-bg-layer-2);font-size:var(--fs-caption)}
.chip.agent{color:var(--dsw-alias-agent-primary);background:color-mix(in srgb,var(--dsw-alias-agent-primary) 14%,transparent);border-color:transparent}
.chip.empty{border-style:dashed;color:var(--dsw-alias-label-tertiary);background:transparent}

/* ============================================================
   Surfaces
   ============================================================ */
.card{border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-card);background:var(--dsw-alias-bg-layer-1)}
.panel{border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-panel);background:var(--dsw-alias-bg-layer-1);padding:12px 14px}
.section{display:flex;flex-direction:column;gap:8px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.section-head h2,.section-head h3{margin:0;font-size:var(--fs-title);line-height:1.4}
.count{color:var(--dsw-alias-label-secondary);font-size:var(--fs-caption)}
.hint{margin:0;color:var(--dsw-alias-label-secondary);font-size:var(--fs-caption);line-height:1.6}
.divider{height:1px;background:var(--dsw-alias-border-l2);margin:10px 0}

.table{display:grid;border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-card);overflow:hidden}
.row{display:grid;gap:10px;align-items:center;padding:9px 10px;border-bottom:0.5px solid var(--dsw-alias-border-l3);background:var(--dsw-alias-bg-layer-1)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--dsw-alias-bg-layer-2)}
.label{display:block;color:var(--dsw-alias-label-tertiary);font-size:var(--fs-micro);line-height:1.4}
.value{display:block;margin-top:2px;font-size:var(--fs-secondary);line-height:1.45;overflow-wrap:anywhere}
.subvalue{display:block;margin-top:2px;color:var(--dsw-alias-label-secondary);font-size:var(--fs-caption);line-height:1.45;overflow-wrap:anywhere}

.empty{padding:28px;border:0.5px dashed var(--dsw-alias-border-l3);border-radius:var(--radius-card);color:var(--dsw-alias-label-secondary);text-align:center;font-size:var(--fs-secondary);line-height:1.6}
.loading{padding:32px;color:var(--dsw-alias-label-secondary);text-align:center;font-size:var(--fs-body)}
.errorbar{padding:8px 10px;border:0.5px solid color-mix(in srgb,var(--dsw-alias-state-error-primary) 45%,transparent);border-radius:var(--radius-control);color:var(--dsw-alias-state-error-primary);font-size:var(--fs-secondary)}
.noticebar{padding:8px 10px;border:0.5px solid color-mix(in srgb,var(--dsw-alias-state-success-primary) 38%,transparent);border-radius:var(--radius-control);color:var(--dsw-alias-state-success-primary);font-size:var(--fs-secondary)}
.readonly{display:flex;align-items:center;min-height:32px;padding:0 9px;border:0.5px dashed var(--dsw-alias-border-l3);border-radius:var(--radius-control);color:var(--dsw-alias-label-secondary);font-size:var(--fs-secondary)}

/* ============================================================
   Forms
   ============================================================ */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form-grid .wide{grid-column:1 / -1}
.field{display:grid;gap:5px;min-width:0}
.field>.label{font-size:var(--fs-caption)}
.field .hint{margin-top:2px}
.form-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.checkboxes{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.checkbox{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-control);background:var(--dsw-alias-bg-layer-1);color:var(--dsw-alias-label-secondary);font-size:var(--fs-caption);white-space:nowrap;cursor:pointer}
.checkbox:has(input:checked){border-color:color-mix(in srgb,var(--dsw-alias-accent-primary) 50%,transparent);color:var(--dsw-alias-label-primary);background:color-mix(in srgb,var(--dsw-alias-accent-primary) 12%,transparent)}
.checkbox input{margin:0}

/* ============================================================
   Modal / toast / drawer
   ============================================================ */
.mask{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(8,10,14,.55)}
.mask.open{display:flex}
.modal{width:min(680px,100%);max-height:86vh;overflow:auto;padding:16px;border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-panel);background:var(--dsw-alias-bg-layer-1);box-shadow:var(--shadow-3)}
.modal.wide{width:min(960px,100%)}
.modal.narrow{width:min(520px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.modal-head h2{margin:0;font-size:15px;line-height:1.4}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

.toast{position:fixed;left:50%;bottom:26px;z-index:70;transform:translate(-50%,12px);padding:9px 14px;border:1px solid var(--dsw-alias-border-l3);border-radius:var(--radius-panel);background:var(--dsw-alias-bg-layer-1);box-shadow:var(--shadow-2);color:var(--dsw-alias-label-primary);font-size:var(--fs-secondary);opacity:0;pointer-events:none;transition:opacity .16s ease,transform .16s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.error{color:var(--dsw-alias-state-error-primary);border-color:color-mix(in srgb,var(--dsw-alias-state-error-primary) 45%,transparent)}

.drawer-mask{position:fixed;inset:0;z-index:30;display:none;background:rgba(8,10,14,.32)}
.drawer-mask.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:30;width:min(560px,calc(100vw - 40px));display:none;flex-direction:column;background:var(--dsw-alias-bg-layer-1);border-left:1px solid var(--dsw-alias-border-l3);box-shadow:var(--shadow-2)}
.drawer.open{display:flex}
.drawer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--dsw-alias-border-l2)}
.drawer-head h2{margin:0;font-size:var(--fs-detail);line-height:1.35}
.drawer-body{flex:1;min-height:0;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}

/* ============================================================
   Common list items
   ============================================================ */
.list{display:grid;gap:5px}
.list-item{display:flex;align-items:center;gap:8px;width:100%;min-width:0;padding:8px 9px;border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-card);background:var(--dsw-alias-bg-layer-1);color:inherit;text-align:left}
.list-item:hover{background:var(--dsw-alias-bg-layer-2)}
.list-item.active{border-color:color-mix(in srgb,var(--dsw-alias-accent-primary) 55%,transparent);background:color-mix(in srgb,var(--dsw-alias-accent-primary) 12%,transparent)}
.list-copy{flex:1;min-width:0}
.list-copy strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-secondary);font-weight:600}
.list-copy small{display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dsw-alias-label-secondary);font-size:var(--fs-caption)}
.list-mark{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:var(--radius-control);background:var(--dsw-alias-bg-layer-3);color:var(--dsw-alias-label-secondary);font-size:var(--fs-caption);font-weight:700}

.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .spacer{flex:1}
.meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--dsw-alias-label-secondary);font-size:var(--fs-caption)}
.actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}

.timeline{display:grid;gap:8px}
.event{display:grid;grid-template-columns:8px minmax(0,1fr);gap:10px;padding:10px 11px;border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-card);background:var(--dsw-alias-bg-layer-1)}
.event-dot{width:7px;height:7px;margin-top:5px;border-radius:999px;background:var(--dsw-alias-accent-primary)}
.event-dot.agent{background:var(--dsw-alias-agent-primary)}
.event-dot.warn{background:var(--dsw-alias-state-warning-primary)}
.event-dot.error{background:var(--dsw-alias-state-error-primary)}
.event-title{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.event-title strong{font-size:var(--fs-secondary);font-weight:600}
.event-title time{color:var(--dsw-alias-label-tertiary);font-size:var(--fs-micro)}
.event-body{margin-top:3px;color:var(--dsw-alias-label-secondary);font-size:var(--fs-caption);line-height:1.55;overflow-wrap:anywhere}

.markdown{font-size:var(--fs-body);line-height:1.7}
.markdown h3{margin:10px 0 6px;font-size:var(--fs-body);color:var(--dsw-alias-label-primary)}
.markdown h3:first-child{margin-top:0}
.markdown p{margin:4px 0}
.markdown ul{margin:4px 0;padding-left:18px;display:grid;gap:3px}
.markdown code{padding:0 4px;border-radius:var(--radius-chip);background:var(--dsw-alias-bg-layer-2);font-size:var(--fs-caption)}

/* ============================================================
   Workbench
   ============================================================ */
.wb-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.wb-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;align-items:start}
.wb-card{position:relative;grid-column:span var(--wb-cols,6);min-width:0;display:flex;flex-direction:column;border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-panel);background:var(--dsw-alias-bg-layer-1);overflow:hidden}
.wb-card.dragging{opacity:.48;border-color:var(--dsw-alias-accent-primary);box-shadow:var(--shadow-2)}
.wb-card.drop-target{border-color:var(--dsw-alias-accent-primary);background:color-mix(in srgb,var(--dsw-alias-accent-primary) 7%,var(--dsw-alias-bg-layer-1))}
.wb-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:0.5px solid var(--dsw-alias-border-l3);cursor:grab;user-select:none}
.wb-card.dragging .wb-head{cursor:grabbing}
.wb-head h2{margin:0;font-size:var(--fs-title);line-height:1.3;white-space:nowrap}
.wb-head .spacer{flex:1}
.wb-head .btn.icon,.wb-head .seg{cursor:pointer}
.wb-body{padding:12px;min-height:120px;overflow:auto}
.wb-card.fixed-h .wb-body{flex:1;min-height:0;overflow:auto}
.wb-resize{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize}
.wb-resize::after{content:"";position:absolute;left:50%;bottom:2px;width:36px;height:3px;transform:translateX(-50%);border-radius:999px;background:var(--dsw-alias-border-l3);opacity:0;transition:opacity .15s}
.wb-card:hover .wb-resize::after{opacity:1}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{padding:10px;border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-card);background:var(--dsw-alias-bg-layer-2);min-width:0}
.kpi span{display:block;color:var(--dsw-alias-label-secondary);font-size:var(--fs-caption)}
.kpi strong{display:block;margin-top:3px;font-size:17px;line-height:1.3;font-weight:700;white-space:nowrap}
.kpi small{display:block;margin-top:2px;color:var(--dsw-alias-label-tertiary);font-size:var(--fs-micro);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi strong.up{color:var(--dsw-alias-state-success-primary)}
.kpi strong.down{color:var(--dsw-alias-state-error-primary)}

.brief-block{display:grid;gap:10px}
.brief-section{padding:9px 10px;border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-card);background:var(--dsw-alias-bg-layer-2)}
.brief-section h3{margin:0 0 5px;font-size:var(--fs-secondary);font-weight:650}
.brief-section ul{margin:0;padding-left:16px;display:grid;gap:4px;color:var(--dsw-alias-label-secondary);font-size:var(--fs-caption);line-height:1.55}
.decision{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 8px;border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-control);background:var(--dsw-alias-bg-layer-1)}
.decision span{min-width:0;font-size:var(--fs-caption);overflow-wrap:anywhere}

.todo-item{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:9px 10px;border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-card);background:var(--dsw-alias-bg-layer-1);cursor:pointer}
.todo-item:hover{border-color:var(--dsw-alias-border-l4)}
.todo-main{min-width:0}
.todo-title{display:flex;align-items:center;gap:6px;min-width:0}
.todo-title .id{color:var(--dsw-alias-label-tertiary);font-size:var(--fs-micro);flex:none}
.todo-title strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-secondary)}
.todo-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:4px;color:var(--dsw-alias-label-secondary);font-size:var(--fs-micro)}
.todo-trail{display:flex;align-items:center;gap:6px;flex:none}

.cockpit-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.cockpit-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px}

/* ============================================================
   Project
   ============================================================ */
.split{display:grid;grid-template-columns:minmax(230px,290px) minmax(0,1fr);gap:12px;align-items:start}
.directory{display:flex;flex-direction:column;gap:8px;min-width:0}
.directory-title{display:flex;align-items:center;justify-content:space-between;margin-top:4px;color:var(--dsw-alias-label-secondary);font-size:var(--fs-caption)}
.detail{min-width:0;display:flex;flex-direction:column;gap:12px}
.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.title-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.title-line h2{margin:0;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.detail-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:5px;color:var(--dsw-alias-label-tertiary);font-size:var(--fs-caption)}
.detail-meta .workspace-item{display:inline-flex;align-items:center;gap:4px;min-width:0;max-width:100%}
.detail-meta .workspace-label{flex:none;white-space:nowrap}
.detail-meta .workspace-item code{min-width:0;flex:0 1 auto;overflow-wrap:anywhere}
.detail-meta.workspace-meta{margin-top:3px;gap:12px}
.detail-meta code{font:inherit;overflow-wrap:anywhere}
.copy-btn{width:20px;height:20px;flex:none;display:inline-grid;place-items:center;padding:0;border:0;border-radius:4px;background:transparent;color:var(--dsw-alias-label-tertiary);cursor:pointer}
.copy-btn:hover{background:var(--dsw-alias-bg-layer-2);color:var(--dsw-alias-label-primary)}
.copy-btn svg{width:12px;height:12px}
.detail-desc{margin:8px 0 0;color:var(--dsw-alias-label-secondary);font-size:var(--fs-body);line-height:1.6}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{min-width:0;padding:9px 10px;border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-card);background:var(--dsw-alias-bg-layer-2)}
.fact span{display:block;color:var(--dsw-alias-label-secondary);font-size:var(--fs-micro)}
.fact strong{display:block;margin-top:3px;font-size:var(--fs-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fact small{display:block;margin-top:2px;color:var(--dsw-alias-label-tertiary);font-size:var(--fs-micro);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.project-row{grid-template-columns:minmax(140px,1.2fr) minmax(0,120px) minmax(0,1fr) minmax(0,1.05fr) auto;min-width:0}
.project-role-row{grid-template-columns:minmax(120px,.9fr) minmax(120px,1.2fr) 64px 56px 116px;min-width:0}
.member-cell{display:flex;align-items:center;gap:8px;min-width:0}
.member-cell .avatar{width:26px;height:26px;font-size:var(--fs-micro)}
.member-copy{min-width:0}
.member-copy strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-secondary)}
.member-copy small{display:block;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dsw-alias-label-tertiary);font-size:var(--fs-micro)}

.report-card{padding:12px;border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-card);background:var(--dsw-alias-bg-layer-1)}
.report-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.report-head h3{margin:0;font-size:var(--fs-body)}
.report-head small{color:var(--dsw-alias-label-secondary);font-size:var(--fs-micro)}

/* ============================================================
   Task board
   ============================================================ */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:12px;align-items:stretch;min-height:max(420px,calc(100vh - 250px))}
.column{min-width:0;display:flex;flex-direction:column;border:0.5px solid var(--dsw-alias-border-l2);border-radius:var(--radius-panel);background:var(--dsw-alias-bg-layer-1)}
.column.drop{border-color:var(--dsw-alias-accent-primary);box-shadow:0 0 0 1px var(--dsw-alias-accent-primary)}
.column-head{display:grid;grid-template-columns:8px minmax(0,1fr) auto;align-items:center;gap:7px;padding:10px;border-bottom:0.5px solid var(--dsw-alias-border-l2)}
.column-dot{width:7px;height:7px;border-radius:50%;background:var(--dsw-alias-label-tertiary)}
.column-dot.progress{background:var(--dsw-alias-accent-primary)}
.column-dot.review{background:var(--dsw-alias-state-warning-primary)}
.column-dot.done{background:var(--dsw-alias-state-success-primary)}
.column-dot.cancelled{background:var(--dsw-alias-state-error-primary)}
.column-head strong{font-size:var(--fs-secondary)}
.cards{flex:1;display:grid;gap:7px;align-content:start;padding:8px}
.task-card{display:grid;gap:7px;padding:10px;border:0.5px solid var(--dsw-alias-border-l2);border-radius:var(--radius-card);background:var(--dsw-alias-bg-layer-2);cursor:pointer}
.task-card:hover{border-color:var(--dsw-alias-border-l4)}
.task-card.dragging{opacity:.45}
.task-card-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.task-id{color:var(--dsw-alias-label-tertiary);font-size:var(--fs-micro)}
.task-title{font-size:var(--fs-body);font-weight:600;line-height:1.4}
.task-desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--dsw-alias-label-secondary);font-size:var(--fs-caption);line-height:1.45}
.task-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;color:var(--dsw-alias-label-secondary);font-size:var(--fs-micro)}

/* ============================================================
   Workflow
   ============================================================ */
.wf-kpis{margin-bottom:12px}
.wf-kpis .kpi{min-height:74px;background:var(--dsw-alias-bg-layer-1)}
.wf-toolbar{align-items:center}
.wf-filter-search{width:280px}
.wf-instance-section{display:flex;flex-direction:column;gap:8px;min-width:0}
.wf-instance-table{display:grid;border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-card);overflow:hidden;background:var(--dsw-alias-bg-layer-1)}
.wf-instance-head,.wf-instance-row{display:grid;grid-template-columns:minmax(220px,1.5fr) 88px minmax(150px,1fr) 110px 116px 52px;align-items:center;gap:10px;min-width:0}
.wf-instance-head{padding:8px 12px;border-bottom:0.5px solid var(--dsw-alias-border-l2);background:var(--dsw-alias-bg-layer-2);color:var(--dsw-alias-label-tertiary);font-size:var(--fs-micro)}
.wf-instance-row{padding:10px 12px;border-bottom:0.5px solid var(--dsw-alias-border-l3);background:var(--dsw-alias-bg-layer-1);cursor:pointer}
.wf-instance-row:last-child{border-bottom:0}
.wf-instance-row:hover{background:var(--dsw-alias-bg-layer-2)}
.wf-instance-row.active{border-color:color-mix(in srgb,var(--dsw-alias-accent-primary) 55%,transparent);background:color-mix(in srgb,var(--dsw-alias-accent-primary) 9%,var(--dsw-alias-bg-layer-1))}
.wf-instance-main,.wf-instance-current{min-width:0}
.wf-instance-title-line{display:flex;align-items:center;gap:7px;min-width:0}
.wf-instance-title-line strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-secondary);line-height:1.45}
.wf-instance-sub,.wf-instance-current small{display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dsw-alias-label-tertiary);font-size:var(--fs-micro);line-height:1.45}
.wf-instance-current strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-caption);font-weight:600;line-height:1.45}
.wf-instance-project,.wf-instance-started{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dsw-alias-label-secondary);font-size:var(--fs-caption)}
.wf-instance-actions{display:flex;justify-content:flex-end}
.wf-empty{padding:26px 20px;border:0.5px dashed var(--dsw-alias-border-l3);border-radius:var(--radius-card);color:var(--dsw-alias-label-secondary);text-align:center;font-size:var(--fs-secondary)}
.wf-empty-actions{display:flex;justify-content:center;margin-top:10px}
.wf-detail-page{display:flex;flex-direction:column;gap:12px;min-width:0}
.node{display:flex;gap:10px;padding:9px 10px;border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-card);background:var(--dsw-alias-bg-layer-2)}
.node-index{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:var(--radius-control);background:var(--dsw-alias-bg-layer-3);color:var(--dsw-alias-label-secondary);font-size:var(--fs-micro);font-weight:700}
.node.done .node-index{background:color-mix(in srgb,var(--dsw-alias-state-success-primary) 16%,transparent);color:var(--dsw-alias-state-success-primary)}
.node.running .node-index{background:color-mix(in srgb,var(--dsw-alias-accent-primary) 16%,transparent);color:var(--dsw-alias-accent-primary)}
.node.blocked .node-index{background:color-mix(in srgb,var(--dsw-alias-state-error-primary) 16%,transparent);color:var(--dsw-alias-state-error-primary)}
.node-copy{min-width:0;flex:1}
.node-copy strong{display:block;font-size:var(--fs-secondary)}
.node-copy small{display:block;margin-top:2px;color:var(--dsw-alias-label-secondary);font-size:var(--fs-micro);line-height:1.5}

.wf-overview{margin-top:12px;padding:12px;border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-panel);background:var(--dsw-alias-bg-layer-1)}
.wf-overview-modal-body{display:grid;gap:10px}
.wf-canvas.large{max-height:60vh}
.wf-canvas.large .wf-node{width:190px}
.wf-overview-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.wf-overview-head h3{margin:0;font-size:var(--fs-body)}
.wf-legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--dsw-alias-label-secondary);font-size:var(--fs-micro)}
.wf-legend span{display:inline-flex;align-items:center;gap:4px}
.wf-legend i{width:10px;height:10px;display:inline-block;border:1px solid var(--dsw-alias-border-l3)}
.wf-legend i.execution{border-radius:0;background:color-mix(in srgb,var(--dsw-alias-accent-primary) 20%,transparent)}
.wf-legend i.approval{border-radius:5px;background:color-mix(in srgb,var(--dsw-alias-agent-primary) 20%,transparent)}
.wf-legend i.decision{transform:skewX(-12deg);background:color-mix(in srgb,var(--dsw-alias-label-primary) 12%,transparent)}
.wf-legend i.subflow{border-style:dashed;background:transparent}
.wf-canvas{overflow-x:auto;padding:9px 2px 6px}
.wf-flow{display:flex;align-items:center;min-width:max-content}
.wf-arrow{flex:none;padding:0 5px;color:var(--dsw-alias-label-tertiary);font-size:14px}
.wf-arrow.small{padding:0 5px;font-size:12px}
.wf-node{position:relative;width:160px;flex:none;display:flex;flex-direction:column;gap:5px;padding:9px 10px;border:0.5px solid var(--dsw-alias-border-l3);background:var(--dsw-alias-bg-layer-2);color:var(--dsw-alias-label-primary);text-align:left;cursor:pointer}
.wf-node:hover{border-color:var(--dsw-alias-border-l4)}
.wf-node.execution{border-radius:0;border-left:3px solid var(--dsw-alias-accent-primary)}
.wf-node.approval{border-radius:14px;border-left:3px solid var(--dsw-alias-agent-primary)}
.wf-node.decision{border-radius:0;clip-path:polygon(5% 0,100% 0,95% 100%,0 100%);border-left:3px solid var(--dsw-alias-border-l4);background:var(--dsw-alias-bg-layer-3)}
.wf-node.system{border-radius:999px;padding:9px 16px}
.wf-node.subflow{border-radius:var(--radius-panel);border-style:dashed;border-left:3px dashed var(--dsw-alias-border-l4);background:color-mix(in srgb,var(--dsw-alias-label-primary) 4%,transparent)}
.wf-node.current{box-shadow:0 0 0 1px var(--dsw-alias-border-l4)}
.wf-node.running.current{box-shadow:0 0 0 1px var(--dsw-alias-accent-primary)}
.wf-node.blocked.current{box-shadow:none}
.wf-node.selected{background:color-mix(in srgb,var(--dsw-alias-accent-primary) 12%,var(--dsw-alias-bg-layer-2))}
.wf-node-title{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;min-width:0}
.wf-node-title strong{flex:1;min-width:0;font-size:var(--fs-secondary);line-height:1.4;overflow-wrap:anywhere}
.wf-node-state{flex:none;padding:1px 4px;border-radius:var(--radius-chip);background:var(--dsw-alias-bg-layer-3);color:var(--dsw-alias-label-tertiary);font-size:var(--fs-micro);white-space:nowrap}
.wf-node-state.done{color:var(--dsw-alias-state-success-primary);background:color-mix(in srgb,var(--dsw-alias-state-success-primary) 14%,transparent)}
.wf-node-state.progress{color:var(--dsw-alias-accent-primary);background:color-mix(in srgb,var(--dsw-alias-accent-primary) 14%,transparent)}
.wf-node-state.warn{color:var(--dsw-alias-state-error-primary);background:color-mix(in srgb,var(--dsw-alias-state-error-primary) 14%,transparent)}
.wf-node-state.muted{color:var(--dsw-alias-label-tertiary);background:var(--dsw-alias-bg-layer-3)}
.wf-node-number{flex:none;display:inline-grid;place-items:center;min-width:22px;height:18px;padding:0 5px;border-radius:var(--radius-chip);background:var(--dsw-alias-bg-layer-3);color:var(--dsw-alias-label-secondary);font-size:var(--fs-micro);font-weight:700;line-height:1;white-space:nowrap}
.wf-node-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--dsw-alias-label-secondary);font-size:var(--fs-micro)}

.wf-subflow-canvas{overflow-x:auto;padding:6px 0}
.wf-branch{display:grid;gap:6px;padding:8px;border:0.5px dashed var(--dsw-alias-border-l3);border-radius:var(--radius-panel);background:var(--dsw-alias-bg-base)}

.wf-loop-note{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;padding:7px 9px;border:0.5px dashed color-mix(in srgb,var(--dsw-alias-state-warning-primary) 45%,transparent);border-radius:var(--radius-control);background:color-mix(in srgb,var(--dsw-alias-state-warning-primary) 7%,transparent);color:var(--dsw-alias-state-warning-primary);font-size:var(--fs-caption)}

.wf-node-detail{margin-top:12px;padding:14px;border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-panel);background:var(--dsw-alias-bg-layer-1)}

.wf-type-tag{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:var(--radius-chip);background:var(--dsw-alias-bg-layer-2);color:var(--dsw-alias-label-secondary);font-size:var(--fs-micro)}

.wf-node-meta-panel{margin-top:8px;border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-control);background:var(--dsw-alias-bg-layer-2);overflow:hidden}

.rail{position:relative;display:none;min-width:0;min-height:0;flex-direction:column;border-left:1px solid var(--dsw-alias-border-l3);background:var(--dsw-alias-bg-layer-1)}

.rail-body{flex:1;min-height:0;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.meeting-chat{display:flex;flex-direction:column;gap:8px;min-height:0}

.meeting-composer-readonly{padding:12px;border:0.5px dashed var(--dsw-alias-border-l3);border-radius:var(--radius-control);color:var(--dsw-alias-label-secondary);font-size:var(--fs-caption);text-align:center}

.thread-item{display:grid;gap:6px;padding:9px 10px;border:0.5px solid var(--dsw-alias-border-l3);border-radius:var(--radius-card);background:var(--dsw-alias-bg-layer-1);cursor:pointer}

.thread-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}

.thread-project{flex:none;max-width:82px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dsw-alias-label-tertiary);font-size:var(--fs-micro)}

  if (!source || source.type === "manual") return { type: "manual", label: "人工上传", title: "由项目成员直接上传", icon: icon.file, available: false };
  if (source.type === "task") {
    const task = taskById(source.id);
    return { type: "task", label: "任务卡", id: source.id, title: task?.title || source.title || source.id, icon: icon.task, available: true };
  }
  if (source.type === "workflow") {
    const workflow = workflowById(source.id);
    return { type: "workflow", label: "工作流", id: source.id, title: workflow?.title || source.title || source.id, icon: icon.workflow, available: true };
  }
  if (source.type === "meeting") {
    const meeting = meetingById(source.id);
    return { type: "meeting", label: "会议", id: source.id, title: meeting?.title || source.title || source.id, icon: icon.meeting, available: true };
  }
  return { type: source.type, label: "来源记录", title: source.title || source.id || "未知来源", icon: icon.file, available: false };
}

/* ---------------- workbench layout store ---------------- */
function defaultModules() {
  const modules = {};
  for (const meta of WB_MODULES) modules[meta.id] = { cols: meta.cols, height: null };
  return modules;
}
function factoryLayouts() {
  return {
    layouts: [{ id: "factory", name: "默认工作台", order: [...WB_ORDER], modules: defaultModules() }],
    defaultId: "factory",
    activeId: "factory"
  };
}
function normalizeModules(raw) {
  const modules = defaultModules();
  if (raw && typeof raw === "object") {
    for (const meta of WB_MODULES) {
      const value = raw[meta.id];
      if (!value) continue;
      const rawHeight = value.height;
      const hasHeight = rawHeight !== null && rawHeight !== undefined && String(rawHeight).trim() !== "" && Number.isFinite(Number(rawHeight));
      modules[meta.id] = {
        cols: Math.max(1, Math.min(6, Number(value.cols) || meta.cols)),
        height: hasHeight ? Math.max(190, Math.min(900, Math.round(Number(rawHeight)))) : null
      };
    }
  }
  return modules;
}
function normalizeLayout(raw, fallbackId) {
  const order = [...new Set([...(raw?.order || []), ...WB_ORDER])].filter((id) => WB_ORDER.includes(id));
  return { id: String(raw?.id || fallbackId), name: String(raw?.name || "未命名布局"), order, modules: normalizeModules(raw?.modules) };
}
function loadLayouts() {
  try {
    const raw = JSON.parse(window.localStorage.getItem(LAYOUT_KEY) || "null");
    if (!raw || !Array.isArray(raw.layouts) || raw.layouts.length === 0) return factoryLayouts();
    const layouts = raw.layouts.filter((item) => item && item.id).map((item, index) => normalizeLayout(item, "layout-" + index));
    const defaultId = layouts.some((l) => l.id === raw.defaultId) ? raw.defaultId : layouts[0].id;
    const activeId = layouts.some((l) => l.id === raw.activeId) ? raw.activeId : defaultId;
    return { layouts, defaultId, activeId };
  } catch { return factoryLayouts(); }
}
function persistLayouts() {
  window.localStorage.setItem(LAYOUT_KEY, JSON.stringify({
    layouts: state.layouts,
    defaultId: state.defaultLayoutId,
    activeId: state.activeLayoutId
  }));
}
function activeLayout() {
  return state.layouts.find((l) => l.id === state.activeLayoutId) || state.layouts[0];
}
function defaultLayout() {
  return state.layouts.find((l) => l.id === state.defaultLayoutId) || state.layouts[0];
}
function layoutModules() {
  const layout = activeLayout();
  return layout.order.map((id) => {
    const meta = WB_MODULES.find((m) => m.id === id);
    return { ...meta, ...(layout.modules[id] || { cols: meta.cols, height: null }) };
  });
}
function initLayouts() {
  const loaded = loadLayouts();
  state.layouts = loaded.layouts;
  state.defaultLayoutId = loaded.defaultId;
  state.activeLayoutId = loaded.activeId;
}

function renderMeetingMessageText(text, mentionIds) {
  let html = esc(text);
  mentionIds.map(userById).sort((a, b) => b.name.length - a.name.length).forEach((user) => {
    const token = `@${esc(user.name)}`;
    html = html.split(token).join(`<mark>${token}</mark>`);
  });
  return html;
}

function renderMeetingConversation(meeting, context) {
  const composerContext = context || "rail";
  const isAi = meeting.kind === "ai";
  const isRail = composerContext === "rail";
  const draft = isRail ? state.railMeetingDraft : state.meetingDraft;
  const mentionOpen = isRail ? state.railMeetingMentionOpen : state.meetingMentionOpen;
  const mentionQuery = isRail ? state.railMeetingMentionQuery : state.meetingMentionQuery;
  const isJoined = meeting.participants.includes("olivia");
  const canSend = meeting.status === "进行中" && isJoined;
  const readonlyText = !isJoined
    ? "你尚未加入该会议，暂不可发送消息"
    : meeting.status === "已结束"
      ? "会议已结束，对话记录只读"
      : "会议尚未开始，暂不可发送消息";
  const mentionCandidates = meeting.participants
    .map(userById)
    .filter((user) => user.id !== "olivia")
    .filter((user) => !mentionQuery || `${user.name} ${user.title}`.toLowerCase().includes(mentionQuery.toLowerCase()));
  return `<div class="meeting-chat">
    <div class="meeting-history" id="meetingHistory-${composerContext}" role="log" aria-label="${isAi ? "AI 对话历史" : "会议对话历史"}">
      ${meeting.messages.length ? meeting.messages.map((message) => {
        const sender = userById(message.senderId);
        const self = sender.id === "olivia";
        return `<article class="meeting-message ${self ? "self" : ""}">
          ${avatar(sender, 24)}
          <div class="meeting-message-body">
            <div class="meeting-message-meta"><strong>${self ? "我" : esc(sender.name)}</strong>${sender.kind === "agent" ? '<span class="pill agent">AI</span>' : ""}<time>${esc(message.at)}</time></div>
            <div class="meeting-bubble">${renderMeetingMessageText(message.text, message.mentions || [])}</div>
          </div>
        </article>`;
      }).join("") : emptyState(isAi ? "当前没有对话记录。" : "会议尚未开始，当前没有对话记录。")}
    </div>
    ${canSend ? `<div class="meeting-composer" data-composer-context="${composerContext}">
      ${mentionOpen ? `<div class="meeting-mention-menu" role="listbox" aria-label="选择要提及的参与人">
        ${mentionCandidates.length ? mentionCandidates.map((user) => `<button class="meeting-mention-option" type="button" role="option" data-act="meeting-mention-select" data-id="${user.id}">${avatar(user, 24)}<span class="meeting-mention-copy"><strong>${esc(user.name)}</strong><small>${esc(user.title)}</small></span></button>`).join("") : '<div class="meeting-composer-readonly">没有匹配的参与人</div>'}
      </div>` : ""}
      <textarea id="meetingComposer-${composerContext}" data-act="meeting-composer" placeholder="输入消息，使用 @ 提及参与人">${esc(draft)}</textarea>
      <div class="meeting-composer-toolbar">
        <button class="meeting-at-btn" type="button" data-act="meeting-at-toggle" aria-expanded="${mentionOpen}" aria-label="${isAi ? "提及 AI 伙伴" : "提及会议参与人"}" title="${isAi ? "提及 AI 伙伴" : "提及会议参与人"}">@</button>
        <button class="btn meeting-send-btn" type="button" data-act="meeting-send" aria-label="发送消息" title="发送消息" ${draft.trim() ? "" : "disabled"}>${icon.send}</button>
      </div>
    </div>` : `<div class="meeting-composer-readonly">${readonlyText}</div>`}
  </div>`;

function renderMarkdown(md) {
  return String(md || "").split("\n").map((line) => {
    const text = line.trim();
    if (!text) return "";
    const inline = (value) => esc(value).replace(/`([^`]+)`/g, "<code>$1</code>");
    if (text.startsWith("### ")) return `<h3>${inline(text.slice(4))}</h3>`;
    if (text.startsWith("## ")) return `<h3>${inline(text.slice(3))}</h3>`;
    if (text.startsWith("# ")) return `<h3>${inline(text.slice(2))}</h3>`;
    if (text.startsWith("- ")) return `<div style="padding-left:14px;position:relative"><span style="position:absolute;left:2px">•</span>${inline(text.slice(2))}</div>`;
    return `<p>${inline(text)}</p>`;
  }).join("");
}

const WF_NODE_TYPE_META = {
  approval: { label: "审批", icon: "✓" },
  execution: { label: "执行", icon: "▶" },
  decision: { label: "决策", icon: "?" },
  system: { label: "系统", icon: "⚙" },
  subflow: { label: "子流程", icon: "▣" }
};
const WF_NODE_STATE_LABEL = { done: "已完成", running: "执行中", blocked: "阻塞", waiting: "等待中", skipped: "已跳过" };
const WF_NODE_STATE_TONE = { done: "done", running: "progress", blocked: "warn", waiting: "muted", skipped: "muted" };
const workflowDDL = (sla) => {
  const match = String(sla || "").match(/\d{4}-(\d{2})-(\d{2})/);
  return match ? `${match[1]}-${match[2]}` : "—";
};
const workflowCompactDateTime = (value) => {
  const text = String(value || "").trim();
  if (!text) return "—";
  const absolute = text.match(/(?:(\d{4})-)?(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})/);
  if (absolute) {
    return `${absolute[2].padStart(2, "0")}-${absolute[3].padStart(2, "0")} ${absolute[4].padStart(2, "0")}:${absolute[5]}`;
  }
  const relative = text.match(/(今天|昨天)\s*(\d{1,2}):(\d{2})/);
  if (relative) {
    const date = new Date();
    if (relative[1] === "昨天") date.setDate(date.getDate() - 1);
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    return `${month}-${day} ${relative[2].padStart(2, "0")}:${relative[3]}`;
  }
  return text;
};

function inferWorkflowNodeType(name) {
  if (/决策/.test(name)) return "decision";
  if (/审批|确认|评审|验收/.test(name)) return "approval";
  return "execution";
}

function normalizeWorkflow(workflow) {
  workflow.nodes = workflow.nodes || [];
  workflow.nodes.forEach((node, index) => {
    if (!node.id) node.id = `${workflow.id}-n${index + 1}`;
    if (!node.type) node.type = inferWorkflowNodeType(node.name || "");
    if (!node.sla) node.sla = "2026-10-18 18:00";
    if (!node.slaText) node.slaText = "—";
    if (!node.outputs) node.outputs = [];
    if (!node.actualExecutor) node.actualExecutor = node.state === "done" ? node.owner : "";
    if (!node.updatedAt) node.updatedAt = node.state === "done" ? workflow.startedAt : "";
    if (!node.detail) node.detail = "";
    if (!node.children) node.children = [];
  });
  if (!workflow.flow) workflow.flow = workflow.nodes.map((node) => ({ kind: "node", id: node.id }));
  return workflow;
}

function workflowNodeById(workflow, id) {
  for (const node of workflow.nodes || []) {
    if (node.id === id) return node;
    const child = (node.children || []).find((item) => item.id === id);
    if (child) return child;
  }
  return null;
}

function selectedWorkflowNode(workflow) {
  normalizeWorkflow(workflow);
  if (!state.workflowNodeId || state.workflowNodeId === "none") return null;
  return workflowNodeById(workflow, state.workflowNodeId);
}

function currentWorkflowNode(workflow) {
  normalizeWorkflow(workflow);
  if (workflow.status === "已完成") return workflow.nodes[workflow.nodes.length - 1] || null;
  return workflow.nodes.find((node) => node.state === "blocked")
    || workflow.nodes.find((node) => node.state === "running")
    || workflow.nodes.find((node) => node.state === "waiting")
    || workflow.nodes[0]
    || null;
}

function workflowNodeSequence(workflow) {
  normalizeWorkflow(workflow);
  const numbers = new Map();
  const entries = [];
  const appendNode = (node, number) => {
    if (!node || numbers.has(node.id)) return;
    numbers.set(node.id, number);
    entries.push({ node, number });
    (node.children || []).forEach((child, index) => {
      if (numbers.has(child.id)) return;
      const childNumber = `${number}-${index + 1}`;
      numbers.set(child.id, childNumber);
      entries.push({ node: child, number: childNumber, parentId: node.id });
    });
  };

  let stageNo = 0;
  workflow.flow.filter((stage) => stage.kind !== "loop").forEach((stage) => {
    stageNo += 1;
    if (stage.kind === "node" || stage.kind === "nested") {
      appendNode(workflowNodeById(workflow, stage.id), String(stageNo));
      return;
    }
    if (stage.kind === "branch") {
      stage.lanes.forEach((lane, laneIndex) => {
        lane.nodes.forEach((id, nodeIndex) => {
          const number = lane.nodes.length === 1
            ? `${stageNo}-${laneIndex + 1}`
            : `${stageNo}-${laneIndex + 1}.${nodeIndex + 1}`;
          appendNode(workflowNodeById(workflow, id), number);
        });
      });
    }
  });
  workflow.nodes.forEach((node) => {
    if (numbers.has(node.id)) return;
    stageNo += 1;
    appendNode(node, String(stageNo));
  });
  return { numbers, entries };
}

  const done = w.nodes.filter((node) => node.state === "done").length;
  const stages = w.flow.filter((item) => item.kind !== "loop");
  const loops = w.flow.filter((item) => item.kind === "loop");
  const { numbers } = workflowNodeSequence(w);
  const legend = [
    ["approval", "审批"],
    ["execution", "执行"],
    ["decision", "决策"],
    ["subflow", "子流程"]
  ];
  return `<div class="wf-overview">
    <div class="wf-overview-head">
      <div class="title-line"><h3>流程概览</h3><span class="pill ${WF_STATUS_TONE[w.status] || "muted"}">${esc(w.status)}</span><span class="count">${done}/${w.nodes.length} 节点完成 · ${esc(tpl.name)} ${esc(tpl.version)}</span></div>
      <div class="head-actions"><div class="wf-legend">${legend.map(([kind, label]) => `<span><i class="${kind}"></i>${label}</span>`).join("")}</div><button class="btn secondary small" type="button" data-act="wf-overview-expand">展开流程图</button></div>
    </div>
    <div class="wf-canvas"><div class="wf-flow">${stages.map((stage, index) => `${index ? '<span class="wf-arrow" aria-hidden="true">→</span>' : ""}${renderFlowStage(stage, w, numbers)}`).join("")}</div></div>
    ${loops.map((loop) => `<div class="wf-loop-note"><span>↺</span><strong>${esc(loop.label)}</strong><small>${esc(workflowNodeById(w, loop.from)?.name || "")} → ${esc(workflowNodeById(w, loop.to)?.name || "")}</small></div>`).join("")}
  </div>`;
}

function renderWorkflowOverviewModal() {
  const workflow = workflowById(state.wfSelected);
  normalizeWorkflow(workflow);
  const stages = workflow.flow.filter((item) => item.kind !== "loop");
  const loops = workflow.flow.filter((item) => item.kind === "loop");
  const { numbers } = workflowNodeSequence(workflow);
  const legend = [["approval", "审批"], ["execution", "执行"], ["decision", "决策"], ["subflow", "子流程"]];
  return `<div class="wf-overview-modal-body">
    <div class="wf-legend">${legend.map(([kind, label]) => `<span><i class="${kind}"></i>${label}</span>`).join("")}</div>
    <div class="wf-canvas large"><div class="wf-flow">${stages.map((stage, index) => `${index ? '<span class="wf-arrow" aria-hidden="true">→</span>' : ""}${renderFlowStage(stage, workflow, numbers)}`).join("")}</div></div>
    ${loops.map((loop) => `<div class="wf-loop-note"><span>↺</span><strong>${esc(loop.label)}</strong><small>${esc(workflowNodeById(workflow, loop.from)?.name || "")} → ${esc(workflowNodeById(workflow, loop.to)?.name || "")}</small></div>`).join("")}
  </div>`;
}

function renderFlowStage(stage, w, numbers) {
  if (stage.kind === "node") {
    const node = workflowNodeById(w, stage.id);
    return renderFlowNode(node, w, false, numbers.get(node?.id));
  }
  if (stage.kind === "nested") {
    const parent = workflowNodeById(w, stage.id);
    if (!parent) return "";
    return renderFlowNode(parent, w, false, numbers.get(parent.id));
  }
  if (stage.kind === "branch") {
    return `<div class="wf-branch"><span class="wf-branch-title">${esc(stage.title)}</span>${stage.lanes.map((lane) => `<div class="wf-lane"><div class="wf-lane-nodes">${lane.nodes.map((id) => renderFlowNode(workflowNodeById(w, id), w, false, numbers.get(id))).join('<span class="wf-arrow small" aria-hidden="true">→</span>')}</div></div>`).join("")}</div>`;
  }
  return "";
}

function renderFlowNode(node, w, compact, number) {
  if (!node) return "";
  const meta = WF_NODE_TYPE_META[node.type] || WF_NODE_TYPE_META.execution;
  const deliverableRows = workflowDeliverableRows(node);
  const done = deliverableRows.filter((row) => row.done).length;
  const current = node.state === "running" || node.state === "blocked";
  const selected = state.workflowNodeId === node.id;
  const deliveryOpen = state.wfDeliveryNodeId === node.id;
  const stateTone = WF_NODE_STATE_TONE[node.state] || "muted";
  const timingText = node.state === "done"
    ? workflowCompactDateTime(node.updatedAt)
    : `DDL ${workflowDDL(node.sla)}`;
  return `<div class="wf-node ${node.type} ${node.state} ${current ? "current" : ""} ${selected ? "selected" : ""} ${compact ? "compact" : ""}" role="button" tabindex="0" data-act="wf-node-select" data-id="${esc(node.id)}" aria-pressed="${selected}" aria-label="${esc(`${number || ""} · ${meta.label}节点：${node.name}`)}">
    <span class="wf-node-title"><span class="wf-node-number">${esc(number || "")}</span><strong>${esc(node.name)}</strong></span>
    <span class="wf-node-meta"><span>${esc(node.owner)}</span><span class="wf-node-ddl" ${node.state === "done" ? 'title="实际完成时间"' : ""}>${esc(timingText)}</span></span>
    <span class="wf-node-footer">
      <span class="wf-node-delivery">交付：<button class="wf-delivery-trigger" id="wfDeliveryTrigger-${esc(node.id)}" type="button" data-act="wf-delivery-toggle" data-node-id="${esc(node.id)}" aria-expanded="${deliveryOpen}" aria-label="查看${esc(node.name)}交付物清单">${done}/${deliverableRows.length}</button></span>
      <span class="wf-node-state ${stateTone}">${esc(WF_NODE_STATE_LABEL[node.state] || node.state)}</span>
    </span>
  </div>`;
}

function workflowDeliverableTypeLabel(kind) {
  return kind === "file" ? "文件" : kind === "document" ? "文档" : kind === "link" ? "链接" : "数据";
}

function workflowDeliverableRows(node) {
  const outputs = node.outputs || [];
  const requirements = node.requirements || [];
  if (requirements.length) {
    return requirements.map((requirement) => {
      const output = outputs.find((item) => (
        (requirement.key && (item.requirementKey === requirement.key || item.key === requirement.key))
        || (requirement.title && (item.requirementTitle === requirement.title || item.title === requirement.title || item.name === requirement.title))
      ));
      return {
        title: requirement.title || requirement.key || "交付物",
        type: requirement.type || output?.kind || "file",
        output,
        done: Boolean(output?.done),
        value: output?.done ? output.name : "NA"
      };
    });
  }
  return outputs.map((output) => ({
    title: output.requirementTitle || output.title || String(output.name || "交付物").replace(/\.(pdf|md|docx?|xlsx?|png|jpe?g)$/i, ""),
    type: output.kind || "file",
    output,
    done: Boolean(output.done),
    value: output.done ? output.name : "NA"
  }));
}

function closeWorkflowDeliveryPopover() {
  $('.wf-delivery-trigger[aria-expanded="true"]')?.setAttribute("aria-expanded", "false");
  state.wfDeliveryNodeId = "";
  state.wfDeliveryAnchor = null;
  renderWorkflowDeliveryPopover();
}

function renderWorkflowDeliveryPopover() {
  const popover = $("#wfDeliveryPopover");
  if (!popover) return;
  const workflow = workflowById(state.wfSelected);
  const node = workflowNodeById(workflow, state.wfDeliveryNodeId);
  if (!node || state.view !== "workflows" || state.wfView !== "detail" || !state.wfDeliveryAnchor) {
    popover.className = "wf-delivery-popover";
    popover.innerHTML = "";
    popover.removeAttribute("style");
    return;
  }
  const rows = workflowDeliverableRows(node);
  const anchor = state.wfDeliveryAnchor;
  const width = Math.min(320, window.innerWidth - 24);
  const left = Math.max(12, Math.min(anchor.left, window.innerWidth - width - 12));
  const estimatedHeight = Math.min(240, 54 + rows.length * 34);
  const top = anchor.bottom + 6 + estimatedHeight > window.innerHeight
    ? Math.max(12, anchor.top - estimatedHeight - 6)
    : anchor.bottom + 6;
  popover.className = "wf-delivery-popover open";
  popover.style.left = `${left}px`;
  popover.style.top = `${top}px`;
  popover.innerHTML = `<div class="wf-delivery-popover-title">交付物清单：</div>
    ${rows.length ? `<ul class="wf-delivery-popover-list">${rows.map((row) => `<li><span>${esc(row.title)}：</span><span>${esc(row.value)}</span></li>`).join("")}</ul>` : '<div class="wf-delivery-popover-empty">无交付物要求</div>'}`;
}

function renderWorkflowNodeDetail(w) {
  const selected = selectedWorkflowNode(w);
  const { numbers, entries } = workflowNodeSequence(w);
  if (selected) {
    const number = numbers.get(selected.id) || "";
    return `<div class="section">
      ${sectionHead("节点详情", { actions: `<div class="head-actions"><span class="count">${esc(number)} · 1 / ${entries.length} 个节点</span><button class="btn secondary small" type="button" data-act="wf-node-expand-all">展开全部节点</button></div>` })}
      <div class="wf-node-details">${renderWorkflowNodeDetailCard(w, selected, number, true, numbers)}</div>
    </div>`;
  }
  return `<div class="section">
    ${sectionHead("节点详情", { count: `${entries.length} 个节点` })}
    <div class="wf-node-details">${entries.map(({ node, number }) => renderWorkflowNodeDetailCard(w, node, number, false, numbers)).join("")}</div>
  </div>`;
}

function renderWorkflowNodeDetailCard(w, node, number, selected, numbers) {
  const meta = WF_NODE_TYPE_META[node.type] || WF_NODE_TYPE_META.execution;
  const deliverableRows = workflowDeliverableRows(node);
  const doneOutputs = deliverableRows.filter((row) => row.done).length;
  const stateTone = WF_NODE_STATE_TONE[node.state] || "muted";
  const slaNote = node.slaText && node.slaText !== "—" ? node.slaText : "";
  return `<div class="wf-node-detail ${selected ? "selected" : ""}">
    <div class="wf-node-detail-head">
      <div><div class="title-line"><span class="wf-node-number">${esc(number)}</span><h3>${esc(node.name)}</h3><span class="wf-type-tag ${node.type}">${meta.icon} ${meta.label}</span></div></div>
      <span class="pill ${stateTone}">${esc(WF_NODE_STATE_LABEL[node.state] || node.state)}</span>
    </div>
    <div class="wf-node-meta-panel">
      <div class="facts">
        <div class="fact"><span>负责人</span><strong>${esc(node.owner)}</strong></div>
        <div class="fact"><span>实际执行人</span><strong>${esc(node.actualExecutor || "—")}</strong></div>
        <div class="fact"><span>SLA / DDL</span><strong>${esc(node.sla)}</strong>${slaNote ? `<small>${esc(slaNote)}</small>` : ""}</div>
        <div class="fact"><span>更新时间</span><strong>${esc(node.updatedAt || "—")}</strong></div>
      </div>
      ${node.detail ? `<p class="wf-node-desc">${esc(node.detail)}</p>` : ""}
    </div>
    <div class="section">${sectionHead("节点交付物", { count: `${doneOutputs}/${deliverableRows.length}` })}<div class="wf-output-list">${deliverableRows.length ? deliverableRows.map((row) => `<div class="wf-output ${row.done ? "done" : ""}"><span class="wf-check" aria-hidden="true">${row.done ? "✓" : ""}</span><span class="wf-output-name"><strong>${esc(row.title)}</strong>${row.value && row.value !== row.title ? `<small>${esc(row.value)}</small>` : ""}</span><span class="wf-output-type">${workflowDeliverableTypeLabel(row.type)}</span>${row.done && row.output ? `<button class="btn secondary small" type="button" data-act="wf-output-action" data-kind="${esc(row.output.kind)}" data-name="${esc(row.output.name)}">${row.output.kind === "file" || row.output.kind === "document" ? "下载" : "复制"}</button>` : `<span class="wf-output-missing">缺失</span>`}</div>`).join("") : `<div class="wf-output no-requirement"><span class="wf-check" aria-hidden="true"></span><span class="wf-output-name"><strong>无交付物要求</strong><small>完成节点无需提交附件</small></span><span class="wf-output-type">NA</span><span class="wf-output-missing">无要求</span></div>`}</div></div>
    ${renderNodeBusiness(node)}
    ${renderNestedChildren(node, numbers)}
    ${node.state === "running" || node.state === "blocked" ? `<div class="wf-node-actions">${node.state === "running" ? `<button class="btn small" type="button" data-act="wf-node-complete" data-id="${w.id}" data-node-id="${esc(node.id)}">完成节点</button>` : ""}${node.state === "blocked" ? `<button class="btn small" type="button" data-act="wf-node-unblock" data-id="${w.id}" data-node-id="${esc(node.id)}">解除阻塞</button>` : ""}</div>` : ""}
  </div>`;
}

function renderNodeBusiness(node) {
  const business = node.business;
  const sections = [];
  if (business?.kind === "approval") {
    sections.push(`<div class="section">${sectionHead("审批信息")}<div class="facts" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="fact"><span>审批人</span><strong>${esc((business.approvers || []).join("、") || "—")}</strong></div><div class="fact"><span>结论</span><strong>${esc(business.result || "待审批")}</strong></div></div>${business.comments ? `<p class="hint">${esc(business.comments)}</p>` : ""}</div>`);
  }
  if (business?.kind === "form") {
    sections.push(`<div class="section">${sectionHead("业务详情")}<div class="table">${(business.fields || []).map(([label, value]) => `<div class="row" style="grid-template-columns:140px minmax(0,1fr)"><span class="label">${esc(label)}</span><span class="value">${esc(value)}</span></div>`).join("")}</div></div>`);
  }
  if (business?.kind === "task") {
    const task = taskById(business.taskId);
    if (task) {
      sections.push(`<div class="section">${sectionHead("关联任务")}<div class="todo-item" data-act="wf-open-task" data-id="${task.id}" role="button" tabindex="0"><div class="todo-main"><div class="todo-title"><span class="id">${task.id}</span><strong>${esc(task.title)}</strong></div><div class="todo-meta"><span class="pill ${task.status === "review" ? "notice" : "muted"}">${statusLabel(task.status)}</span><span>${esc(userById(task.assignee).name)}</span></div></div><button class="btn secondary small">详情</button></div></div>`);
    }
  }
  const meetingIds = [...new Set([
    ...(node.meetingIds || []),
    ...(business?.kind === "meeting" && business.meetingId ? [business.meetingId] : [])
  ])];
  if (meetingIds.length) {
    sections.push(`<div class="section">${sectionHead("关联会议", { count: meetingIds.length })}<div class="list">${meetingIds.map((meetingId) => {
      const meeting = meetingById(meetingId);
      return `<div class="todo-item" data-act="wf-open-meeting" data-id="${meeting.id}" role="button" tabindex="0"><div class="todo-main"><div class="todo-title"><span class="id">${meeting.id}</span><strong>${esc(meeting.title)}</strong></div><div class="todo-meta"><span>${esc(meeting.time)}</span><span>·</span><span>${esc(meeting.status)}</span></div></div><button class="btn secondary small">打开</button></div>`;
    }).join("")}</div></div>`);
  }
  const outputNames = new Set((node.outputs || []).map((output) => output.name));
  const attachments = [
    ...(node.attachments || []),
    ...(business?.kind === "deliverable" ? (business.files || []).filter((file) => !outputNames.has(file.name)) : [])
  ].filter((file, index, files) => files.findIndex((item) => item.name === file.name) === index);
  if (attachments.length) {
    sections.push(`<div class="section">${sectionHead("业务附件", { count: attachments.length })}<div class="wf-attachment-list">${attachments.map((file) => `<div class="wf-attachment"><div class="wf-attachment-copy"><strong>${esc(file.name)}</strong><small>${esc([file.by, file.at].filter(Boolean).join(" · ") || "节点业务附件")}</small></div><span class="wf-attachment-size">${esc(file.size || "文件")}</span><button class="btn secondary small" type="button" data-act="wf-output-action" data-kind="file" data-name="${esc(file.name)}">下载</button></div>`).join("")}</div></div>`);
  }
  return sections.join("");
}

function renderNestedChildren(node, numbers) {
  if (!node.children || node.children.length === 0) return "";
  return `<div class="section">${sectionHead("子流程", { count: `${node.children.length} 个节点` })}<div class="wf-subflow-canvas"><div class="wf-flow">${node.children.map((child, index) => `${index ? '<span class="wf-arrow small" aria-hidden="true">→</span>' : ""}${renderFlowNode(child, null, true, numbers.get(child.id))}`).join("")}</div></div></div>`;
}

function renderMeetingCenterDetail(meeting) {

function renderApp(focusId) {
  const active = document.activeElement;
  const focus = focusId || (active && active.id) || "";
  const start = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const end = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;
  const app = $("#app");
  app.className = [state.railClosed ? "rail-closed" : "", state.meetingOpen ? "meeting-open" : ""].filter(Boolean).join(" ");

    + `<main class="main">${renderView()}</main>`

  if (focus) {
    const el = document.getElementById(focus);
    if (el) {
      el.focus();
      if (start != null) { try { el.setSelectionRange(start, end); } catch (e) { /* noop */ } }
    }
  }
}

/* ---------------- layout mutations ---------------- */
function updateActiveLayout(mutator) {
  const layout = activeLayout();
  mutator(layout);
  persistLayouts();
}
function moveModule(fromId, toId) {
  updateActiveLayout((layout) => {
    const order = layout.order.filter((id) => id !== fromId);
    const index = order.indexOf(toId);
    order.splice(index < 0 ? order.length : index, 0, fromId);
    layout.order = order;
  });
}

/* ---------------- events ---------------- */
document.addEventListener("click", (event) => {
  if (event.target.id === "modalMask") { closeModal(); return; }
  if (event.target.id === "drawerMask") { state.taskSelected = ""; renderDrawer(); return; }
  const clickedDeliveryPopover = event.target.closest("#wfDeliveryPopover");
  const clickedDeliveryTrigger = event.target.closest('[data-act="wf-delivery-toggle"]');
  if (state.wfDeliveryNodeId && !clickedDeliveryPopover && !clickedDeliveryTrigger) {
    state.wfDeliveryNodeId = "";
    state.wfDeliveryAnchor = null;
    renderWorkflowDeliveryPopover();
  }
  if (clickedDeliveryPopover) return;
  const el = event.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case "nav":
      if (el.dataset.view === "meetings") {
        state.view = "meetings";
        state.meetingOpen = false;
        state.meetingTab = "conversation";
        state.meetingPickerOpen = false;
        state.meetingPickerQuery = "";
        renderApp();
        requestAnimationFrame(scrollMeetingHistoryToBottom);
        break;
      }
      state.view = el.dataset.view;
      state.projectManage = false;
      state.projectTemplateOpen = false;
      state.wfDeliveryNodeId = "";
      state.wfDeliveryAnchor = null;
      state.meetingOpen = false;
      renderApp();
      break;
    case "ws-project":
      state.view = "projects";
      state.projectId = el.dataset.id;
      state.projectManage = false;
      state.projectTemplateOpen = false;
      renderApp();
      break;
    case "rail-toggle":
      state.railClosed = !state.railClosed;
      renderApp();
      break;
    case "account": openModal("account"); break;
    case "settings": openModal("settings"); break;
    case "switch-account": closeModal(); toast("已切换演示账号（仅演示）"); renderApp(); break;
    case "identity-tab": state.identityTab = el.dataset.tab; renderModal(); break;
    case "identity-account-toggle": toast("账号状态已更新（演示）"); break;
    case "account-invite-open": openModal("account-invite"); break;
    case "account-invite-save": {
      const name = ($("#inviteName")?.value || "").trim();
      const email = ($("#inviteEmail")?.value || "").trim();
      if (!name || !email) { toast("请填写姓名与邮箱", "error"); break; }
      USERS.push({ id: "user-" + Date.now(), name, kind: "human", title: "平台成员", platformRoles: [$("#inviteRole").value], email, org: "待分配", lastActive: "刚刚" });
      closeModal(); state.identityTab = "accounts"; openModal("account"); toast("已邀请账号");
      break;
    }
    case "employee-create-open": openModal("employee-create"); break;
    case "employee-create-save": {
      const name = ($("#employeeName")?.value || "").trim();
      if (!name) { toast("请填写员工姓名", "error"); break; }
      const kind = $("#employeeKind").value;
      USERS.push({ id: (kind === "agent" ? "agent-" : "employee-") + Date.now(), name, kind, title: ($("#employeeTitle")?.value || "").trim() || "待定义岗位", platformRoles: ["平台成员"], email: kind === "human" ? "pending@platform.dev" : "实例 · " + name, org: ($("#employeeOrg")?.value || "").trim() || "待分配", lastActive: "刚刚" });
      closeModal(); state.identityTab = "employees"; openModal("account"); toast("已新增员工");
      break;
    }
    case "external-agent-open": openModal("external-agent"); break;
    case "external-agent-save": {
      const name = ($("#externalAgentName")?.value || "").trim();
      if (!name) { toast("请填写 Agent 名称", "error"); break; }
      TEAMMATES.push({ id: "tm-external-" + Date.now(), name, profile: "外部 Agent", owner: "Olivia", status: "待命", version: "v1.0", desc: `外部 Agent · ${($("#externalAgentEndpoint")?.value || "").trim() || "未提供地址"}`, soul: "只处理已授权的工作。", tools: ["docs", "task"], scopes: ["工作区：一切皆插件"] });
